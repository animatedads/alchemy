# cloudctl.conf -- Cloud Control settings.  Architecture: Tom Dyer.  Coding: Claude (Opus 5.5), 7 Nov 2026.
# $AUTOBUILD = the alchemy-autobuild directory; $CLOUDCTL = this cloudctl directory.
# Provider plug-ins: provider.<name>=<file.cls>:<Class>.  A new provider is a new file and one line here.
provider.gcp=$CLOUDCTL/src/CloudGcp.cls:CloudGcpProvider
provider.aws=$CLOUDCTL/src/CloudAws.cls:CloudAwsProvider
provider.azure=$CLOUDCTL/src/CloudAzure.cls:CloudAzureProvider
provider.oci=$CLOUDCTL/src/CloudOci.cls:CloudOciProvider
provider.vultr=$CLOUDCTL/src/CloudVultr.cls:CloudVultrProvider
# gcloud always runs through the account wrapper (ALCHEMY_GCLOUD_ACCOUNT_WRAPPER overrides, for tests)
gcloud_wrapper=$AUTOBUILD/gcloud-account.sh
# Vultr API key file (mode 600).  Blank: VULTR_API_KEY_FILE, then VULTR_API_KEY, then ~/.config/vultr/api-key.
vultr_api_key_file=
# ops-YYYYMM.tsv, machines.tsv and events-YYYYMMDD.log
log_dir=$CLOUDCTL/var
work_dir=$CLOUDCTL/var
logging_package=$AUTOBUILD/repo/packages/oorexx_logging_v0.7/src/LoggingCore.cls
require_logging=yes
