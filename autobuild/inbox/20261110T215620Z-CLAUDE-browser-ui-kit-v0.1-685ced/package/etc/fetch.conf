# fetch.conf -- fetch-for-me policy.  Architecture: Tom Dyer.  Coding: Claude (Opus 5.5), 8 November 2026.
# Hosts: a listed host and its subdomains (mirrors such as x.dl.sourceforge.net).  Anything else is refused,
# including a redirect to an unlisted host.
allow_hosts=sourceforge.net svn.code.sf.net downloads.sourceforge.net
allow_kinds=http svn
max_bytes=52428800
max_redirects=6
excerpt_chars=12000
store_dir=$HOME/alchemy-autobuild/fetched
# who may order a fetch (mailbox principals; the mailbox authenticates the sender)
order_issuers=CLAUDE CHATGPT COORDINATOR TOM
# Boston Crab's action concepts that mean "fetch" (fetch, read, get, download, retrieve as of v0.21)
fetch_actions=bring~01435927-v read~00626756-v download get retrieve
# the mailbox, as ALCHEMYFETCH (bin/alchemyfetch.rex)
mailbox_url=https://rasenfalcon.duckdns.org/mcp
token_file=$HOME/.config/alchemy/alchemyfetch.token
poll_seconds=30
