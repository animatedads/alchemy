# mail-nudge.conf -- when bin/mailnudge.rex tells a chat it has mail.  var/mail-nudge.local.conf overrides.
# Architecture: Tom Dyer.  Coding: Claude (Opus 5.5), 15 Nov 2026.
# The mailbox journal, read directly and read-only (run the nudger on the machine that runs the mailbox)
journal=$HOME/agent-mailbox-mcp/state/mailbox-journal.jsonl
# who gets nudged: chats sign in as these principals (CLAUDE-PC, CODEX-PC, TOM, ALCHEMYFETCH are not chats)
principals=CLAUDE CHATGPT COORDINATOR
poll_seconds=60
# a chat is nudged at most every 10 minutes; new mail in that time goes into one nudge
min_interval_minutes=10
# the same unread set is nudged again after an hour, twice; then the chat is STALLED and logged for Tom
renudge_minutes=60
max_renudges=2
# loop guard: a thread with 12 requests since Tom last wrote in it is HELD (agents answering each other for ever)
max_thread_hops=12
lane_hourly_cap=6
daily_cap=200
max_ids_in_nudge=8
backoff_minutes=5
# ignore requests older than this (journal time, e.g. 20261115T000000Z); empty: none ignored
since=
