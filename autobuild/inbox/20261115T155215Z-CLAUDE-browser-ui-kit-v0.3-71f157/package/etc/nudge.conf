# nudge.conf -- which chat reads which lane.  Used by ALCHEMYFETCH (to nudge the sender of a fetch order) and by
# bin/mailnudge.rex (to tell a chat it has mail).  var/nudge.local.conf is read after this file and replaces a
# line for the same lane and principal; "mailnudge.rex bind" writes there.
# Architecture: Tom Dyer.  Coding: Claude (Opus 5.5), 10 Nov 2026; principal and paths 15 Nov 2026.
# One lane per chat, so the lane names the chat.  Lines:
#   LANE|ADAPTER|CHAT                principal from the adapter: claude=CLAUDE, chatgpt=CHATGPT
#   LANE|PRINCIPAL|ADAPTER|CHAT      e.g. programme|COORDINATOR|chatgpt|/c/<id>
# CHAT: the conversation's path from its address (/c/<id> on chatgpt.com, /chat/<uuid> on claude.ai), which
# never changes, or its title as the sidebar shows it.  A nudge carries only lane and request ids.
browser-ui-fixtures|claude|Browser control for ChatGPT coordination
