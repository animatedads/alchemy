# grid.conf -- ED209 XTP ingress settings for "cloudctl xtp".  Architecture: Tom Dyer.  Coding: Claude (Opus 5.5), 7 Nov 2026.
# Members are the etc/machines/*.machine files with xtp_link=L3 (native XTP, IP protocol 36) or L4 (XTP over UDP;
# Google nodes).  Their address= is what goes into every other node's peer sets.
udp_port=62801
# The operator workstation's public address (CIDR), from Tom, 7 Nov 2026; empty = workstation rules are left as they are.
workstation=82.68.79.12/32
workstation_udp=62000-63000
# Rule names on named-rule providers (GCP, Azure); these are the names the bash cloudctl.sh used on Azure.
peers_raw_rule=ed209-xtp-peers
peers_udp_rule=ed209-xtp-udp
workstation_raw_rule=ed209-xtp-workstation-raw36
workstation_udp_rule=ed209-xtp-workstation-udp
