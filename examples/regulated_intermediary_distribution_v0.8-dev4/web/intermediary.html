<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Federation Intermediary</title><link rel="stylesheet" href="/rid/intermediary.css"></head><body>
<header class="rid-topbar"><div class="rid-brand">Federation Intermediary<small>Regulated distribution workspace</small></div><div class="rid-security">Server-authoritative · digitally signed</div></header>
<main class="rid-page"><section class="rid-intro"><h1>Cases requiring attention</h1><p>Mortgage, investment and All Japan insurance cases reflect the provider's authoritative status.</p></section><div id="app" aria-live="polite"></div><div id="browser-status" class="rid-status" data-state="connecting">Connecting to Federation…</div></main>
<script type="module">
import{QueueFabricGatewayTransport,Comms,DefinitionRegistry,BrowserRenderer,WireUIRuntime,RenderProfileController}from'/wire-ui-js/src/index.js';import{bindRIDWorkspaceActions}from'/rid/rid-browser-runtime.js';
const p=new URLSearchParams(location.search),port=p.get('gatewayPort'),gatewayHost=p.get('gatewayHost')||location.hostname,url=p.get('gatewayUrl')||`ws://${gatewayHost}:${port}/wire-ui?token=rid-browser-token`,ownership={applicationId:'RID-APP',sessionId:'RID-SESSION',accessPointId:'WEB'},status=document.getElementById('browser-status'),mount=document.getElementById('app');
const transport=new QueueFabricGatewayTransport({url,outboundQueue:'WIREUI.IN.WEB',ownership,putResultMode:'required'}),comms=new Comms({transport,source:'RID-BROWSER',destination:'WIREUI.IN.WEB'}),definitions=new DefinitionRegistry(),renderer=new BrowserRenderer({definitions,mount,document}),profile=new RenderProfileController({comms,definitions,renderer,siteId:'FEDERATION_RID_INTERMEDIARY'}),runtime=new WireUIRuntime({comms,definitions,renderer,serverSemantic:true,renderProfile:profile,ownership}),authority=bindRIDWorkspaceActions({renderer,runtime,comms});window.RID_BROWSER={transport,comms,definitions,renderer,runtime,authority};
comms.onAny((payload,e)=>{if(e.kind==='UI_VIEW_SNAPSHOT'||e.kind==='UI_VIEW_PATCH'){status.textContent='Connected · authoritative case state current';status.dataset.state='connected'}});comms.onState(e=>{if(e.type==='inbound-handler-error'){status.textContent=`Browser render error: ${e.error?.message??'unknown'}`;status.dataset.state='error';document.documentElement.dataset.acceptance='ERROR'}});
try{await comms.connect(profile.helloPayload({accessPointId:'WEB'}))}catch(e){status.textContent=`Connection failed: ${e.message}`;status.dataset.state='error';document.documentElement.dataset.acceptance='ERROR'}
</script><script type="module">if(new URLSearchParams(location.search).get('acceptance')==='1')await import('/rid/browser-acceptance.js');</script></body></html>
