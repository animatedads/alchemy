# Example only. Keep portal-issued credentials out of this file.
bridge.id=faa-swim-aim-fns
provider.kind=SOLACE
provider.url=<portal JMS URL>
jndi.initial.context.factory=com.solacesystems.jndi.SolJNDIInitialContextFactory
connection.factory=<portal connection factory>
inbound.destination=<portal queue name>
message.vpn=<portal message VPN>
local.inbound.queue=FAA.SWIM.AIM_FNS

# Current monitoring default: non-transacted JMS Session.AUTO_ACKNOWLEDGE (1).
session.mode=AUTO_ACKNOWLEDGE
# Alternatives: CLIENT_ACKNOWLEDGE, TRANSACTED

# Leave the administered JNDI ConnectionFactory unchanged unless explicitly
# diagnosing/deploying a Solace transport policy.
transport.mode=ADMINISTERED
# Alternatives for Solace: DIRECT, GUARANTEED

credential.username.env=FAA_SWIM_JMS_USERNAME
credential.password.env=FAA_SWIM_JMS_PASSWORD
# Optional Secret Broker alternative:
# credential.username.reference=jms/faa/username
# credential.password.reference=jms/faa/password
# Optional if not using the JVM/provider defaults:
# ssl.trust.store=/path/to/truststore.jks
# ssl.trust.store.format=jks
