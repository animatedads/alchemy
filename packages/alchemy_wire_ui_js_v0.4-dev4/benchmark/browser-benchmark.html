<!doctype html><meta charset="utf-8"><title>Wire UI browser benchmark</title><div id="mount"></div><pre id="result">pending</pre>
<script type="module">
import { DefinitionRegistry, BrowserRenderer } from '../src/index.js';
const definition = {
  id:'BENCH.TEXT', version:1, profileId:'*', root:'root',
  nodes:[{key:'root', primitive:'text'}],
  slots:[{index:0, name:'value', target:'root', writer:'text'}], actions:[]
};
const definitions = new DefinitionRegistry();
definitions.install(definition);
const renderer = new BrowserRenderer({ definitions, mount: document.querySelector('#mount'), document });
renderer.prepareDefinition(definition);
renderer.createInstance({ instanceId:1, definitionId:definition.id, definitionVersion:1, slots:['0'] });
renderer.setRoot(1);
const iterations = 250000;
// Warm the compiled writer and DOM property path.
for (let i=0; i<5000; i++) renderer.setSlot(1, 0, i);
const start = performance.now();
for (let i=0; i<iterations; i++) renderer.setSlot(1, 0, i);
const elapsedMs = performance.now() - start;
const result = { benchmark:'browser-direct-dom-slot-writer', iterations, elapsedMs:Number(elapsedMs.toFixed(3)), mutationsPerSecond:Math.round(iterations/(elapsedMs/1000)), finalText:document.querySelector('#mount').textContent };
document.querySelector('#result').textContent = JSON.stringify(result);
document.documentElement.dataset.done='1';
</script>
