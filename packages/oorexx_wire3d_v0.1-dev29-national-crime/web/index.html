<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Wire3D</title>
<style>html,body{margin:0;height:100%;background:#05080a;color:#b9c4c7;font:12px ui-monospace,monospace;overflow:hidden}canvas{width:100%;height:100%;touch-action:none}#bar,#detail,#diag,#nav{position:fixed;border:1px solid #334247;background:#091013e8;letter-spacing:.06em;backdrop-filter:blur(6px)}#bar{left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));padding:9px 12px}#detail{left:max(12px,env(safe-area-inset-left));bottom:max(64px,calc(env(safe-area-inset-bottom) + 52px));padding:12px;max-width:min(420px,calc(100vw - 48px));line-height:1.45}#detail strong,#detail small{display:block}#detail strong{color:#dce4e5;font-size:14px}#detail small{opacity:.65;margin:3px 0 9px;overflow-wrap:anywhere}#detail b{display:inline-block;min-width:110px;color:#7f969c;font-weight:400}#diag{left:max(12px,env(safe-area-inset-left));top:58px;padding:8px 10px;white-space:pre;font-size:9px;line-height:1.4;opacity:.82;pointer-events:none}#diag[data-pass='true']{border-color:#557069}#diag[hidden]{display:none}#nav{left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:5px;padding:5px}#nav button{min-width:44px;height:38px;border:1px solid #3b4b50;background:#111a1e;color:#c9d2d4;font:11px ui-monospace,monospace;letter-spacing:.05em}#nav button:hover{background:#1a272c}#rule{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(64px,calc(env(safe-area-inset-bottom) + 52px));opacity:.42;text-align:right;pointer-events:none}@media(max-width:600px){#bar{font-size:10px}#detail{right:12px;max-width:none}#rule{top:50px;bottom:auto;font-size:9px}#nav{width:max-content;max-width:calc(100vw - 24px)}}
#detail{width:min(440px,calc(100vw - 48px));max-height:72vh;overflow:auto}.cardhead{display:flex;gap:12px;align-items:flex-start}.cardhead img{width:96px;height:116px;object-fit:cover;border:1px solid #52676d;background:#111}.cardhead strong{font-size:17px}.facts{margin:12px 0;border-top:1px solid #26383e}.kv{display:grid;grid-template-columns:120px 1fr;padding:5px 0;border-bottom:1px solid #18272c}.kv b{min-width:0!important}.section{margin-top:12px;padding:6px 0;color:#789aa3;border-bottom:1px solid #334247}.links{display:grid;gap:4px;margin-top:6px}.link,.media{border:1px solid #334247;background:#0d171b;color:#d0d9da;padding:7px;text-align:left;font:11px ui-monospace,monospace}.link span,.link small{display:block}.link small{color:#789096;margin-top:3px}.link:hover,.media:hover{background:#16272d}.mediaRow{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}#mediaOverlay{position:fixed;inset:4vh 4vw;z-index:20;background:#05090bea;border:1px solid #52676d;display:grid;grid-template-rows:auto auto 1fr;padding:12px;backdrop-filter:blur(10px)}#mediaOverlay img{max-width:100%;max-height:78vh;margin:auto;object-fit:contain}#mediaOverlay .close{justify-self:end;background:#111b1f;color:#d6dfe0;border:1px solid #52676d;padding:8px 14px}#mediaOverlay .mediaTitle{color:#86aab3;letter-spacing:.08em;margin:4px 0 8px}.mapElement{margin-top:7px;border:1px solid #334247;background:#081014;padding:5px}.mapElement iframe{display:block;width:100%;height:190px;border:0;filter:saturate(.55) brightness(.78) contrast(1.08)}.mapFoot{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:7px;padding-top:5px;font-size:9px;color:#789096}.mapFoot a{color:#8eabb2;text-decoration:none}@media(max-width:600px){#detail{width:auto;max-height:58vh}.cardhead img{width:76px;height:92px}.mapElement iframe{height:150px}.mapFoot{grid-template-columns:1fr auto}.mapFoot button{grid-column:1/-1}}

#presentationOverlay{position:fixed;inset:5vh 5vw;z-index:19;background:#05090bf2;border:1px solid #52676d;padding:14px;overflow:auto;backdrop-filter:blur(10px)}#presentationOverlay .pclose{float:right;background:#111b1f;color:#d6dfe0;border:1px solid #52676d;padding:8px 14px}.pmedia{margin-top:18px;border:1px solid #334247;background:#091013;padding:12px}.pmedia audio,.pmedia video{width:100%;max-height:38vh}.pbody{display:grid;grid-template-columns:minmax(170px,240px) 1fr;gap:12px;margin-top:12px}.pspeakers{display:grid;gap:8px}.pspeaker{border:1px solid #334247;background:#0b1418;padding:8px}.pspeaker img{width:100%;max-height:190px;object-fit:cover}.pspeaker b,.pspeaker small{display:block;margin-top:5px}.ptranscript{white-space:pre-wrap;border:1px solid #334247;background:#081014;padding:14px;line-height:1.7;min-height:150px}@media(max-width:600px){#presentationOverlay{inset:2vh 3vw}.pbody{grid-template-columns:110px 1fr}.pspeaker img{max-height:110px}}
</style>
<canvas id="v"></canvas><div id="bar">WIRE3D / CONNECTING</div><div id="diag" hidden>RENDER DIAGNOSTIC / WAITING</div><div id="detail" hidden></div><div id="nav" aria-label="Spatial navigation"><button data-nav="home" title="Home / reset (H or R)">HOME</button><button data-nav="prev" title="Previous object (Shift+Tab)">‹</button><button data-nav="frame" title="Frame selected (F)">FRAME</button><button data-nav="workspace" title="Semantic presentation workspace">TRANSCRIPT</button><button data-nav="next" title="Next object (Tab)">›</button></div><div id="rule">SEMANTIC PROJECTION<br>AUTHORITY REMAINS WITH SOURCE<br>NO MASCOTS</div>
<script type="module">import{Wire3DRenderer}from'./wire3d.js';const q=new URLSearchParams(location.search),diag=document.querySelector('#diag');if(q.get('diag')==='1')diag.hidden=false;let r=new Wire3DRenderer(document.querySelector('#v'),document.querySelector('#bar'),document.querySelector('#detail'),diag,document.querySelector('#nav'));fetch('./scene.json',{cache:'no-store'}).then(x=>x.json()).then(s=>r.setScene(s)).catch(e=>document.querySelector('#bar').textContent='WIRE3D / '+e);</script>
