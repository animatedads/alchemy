<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wire analytical presentation</title>
<style>html,body{margin:0;background:#05080a;color:#bdc8ca;font:12px ui-monospace,monospace}#analytics{max-width:1180px;margin:auto;padding:14px}.wa-head{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #34464b;padding:10px 0 14px}.wa-head b,.wa-head small{display:block}.wa-head b{font-size:17px;color:#e0e7e8}.wa-head small,small{color:#789096;margin-top:4px}.wa-state{text-align:right;color:#8ea6ab}.wa-grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px;margin-top:12px}.wa-map,.wa-graph,.wa-grid aside{border:1px solid #34464b;background:#081014;padding:10px}.wa-label{color:#769ba4;letter-spacing:.08em;margin-bottom:8px}.gap{margin-top:18px}.wa-map svg,.wa-graph svg{display:block;width:100%;height:auto;background:#05090b}.wa-map path{fill:#111b1e;stroke:#52676d;stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer}.wa-map path:hover,.wa-map path:focus{fill:#1c2b30;outline:none}.wa-map path.selected{fill:#39545a;stroke:#b6c7c9;stroke-width:2}.wa-time{display:flex;flex-wrap:wrap;gap:5px}.wa-time button{border:1px solid #3b4b50;background:#10191d;color:#c9d2d4;padding:8px}.wa-time button.selected{background:#39545a}.wa-graph{margin-top:12px}.wa-graph polyline{fill:none;stroke:#789da5;stroke-width:2}.wa-graph .point{cursor:pointer}.wa-graph circle{fill:#17262b;stroke:#91aeb4;stroke-width:2}.wa-graph .point.selected circle{fill:#6f8f94}.wa-graph text{fill:#91a1a5;font-size:10px}@media(max-width:700px){#analytics{padding:8px}.wa-grid{grid-template-columns:1fr}.wa-grid aside{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wa-grid aside .gap{margin-top:0}.wa-head{font-size:10px}.wa-map svg{min-height:300px}.wa-graph{overflow-x:auto}.wa-graph svg{min-width:520px}}
</style><main id="analytics">WIRE PRESENTATION / LOADING</main>
<script type="module">import{WireAnalyticsRenderer}from'./wire-analytics.js';const descriptor={title:'AREA ANALYTICS',subtitle:'GENERIC WIRE PRESENTATION / CRIME ANALYTICS QUALIFICATION',objectSelector:{id:'area',selected:'E01000001'},timeSelector:{id:'period',selected:'2025-09',rangeStart:'2025-08',rangeEnd:'2025-09',granularity:'MONTH'},geometryMap:{source:'./lsoa-demo.geojson',identityProperty:'LSOA21CD',labelProperty:'LSOA21NM'},timeGraph:{metric:'COUNT',sourceLabel:'CrimeTrendSeries example fixture',series:[{x:'2025-08',y:10},{x:'2025-09',y:15}]}};new WireAnalyticsRenderer(document.querySelector('#analytics'),descriptor).start().catch(e=>document.querySelector('#analytics').textContent='WIRE PRESENTATION / '+e);</script>
