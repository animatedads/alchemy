<text x="50" y="468" font-family="sans-serif" font-size="12">C changes every absolute level and doubles the clock scale.</text>
<text x="50" y="488" font-family="sans-serif" font-size="12">After declared offset/scale invariance, its cylindrical hash overlays A exactly.</text>
<text x="50" y="748" font-family="sans-serif" font-size="11">A solid / C dotted (the dotted paths disappear beneath the identical solid paths).</text>
<rect x="600" y="420" width="570" height="350" rx="10" fill="#fafafa" stroke="#d0d0d0"/>
<text x="618" y="447" font-family="sans-serif" font-size="16" font-weight="bold">4. What the temporal-pattern index sees</text>
<text x="625" y="470" font-family="monospace" font-size="14">comparison                 dominant   kind/channel             total</text>
<text x="625" y="498" font-family="monospace" font-size="13">A vs C economic twin             0   NONE/NONE                     0</text>
<text x="625" y="526" font-family="monospace" font-size="13">A vs D timing shock            160   ELEVATION/RELATIVE         4220</text>
<text x="625" y="554" font-family="monospace" font-size="13">A vs B price lookalike        1288   TURN/FX                   33545</text>
<text x="625" y="599" font-family="sans-serif" font-size="13" font-weight="bold">The cognitive moment:</text>
<text x="625" y="623" font-family="sans-serif" font-size="12">B looked like A on price, but its FX/relative/volatility vector turns elsewhere.</text>
<text x="625" y="644" font-family="sans-serif" font-size="12">C looked numerically unrelated, but it is the same declared economic-time pattern.</text>
<text x="625" y="665" font-family="sans-serif" font-size="12">D preserves market shape but moves one event in time, so elevation/time evidence changes.</text>
<text x="625" y="697" font-family="sans-serif" font-size="12">Pattern matching asks: “where else did behaviour like this occur?” — not “where was price similar?”</text>
<text x="30" y="826" font-family="sans-serif" font-size="11">Channels: PRICE black (weight 1), RELATIVE blue (4), FX green (4), VOL orange (2). Significance weights are explicit policy, not hidden scalar economics.</text>
</svg>
