name: Complete WebDAV v0.1-dev4 publication
on:
  push:
    branches: [main]
    paths:
      - '.webdav-stage/**'
      - '.github/workflows/webdav-publish.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and expand qualified package
        shell: bash
        run: |
          set -euo pipefail
          cat .webdav-stage/chunk-* > /tmp/oorexx_webdav_v0.1-dev4.zip
          echo 'd9c13c7bb2143ade3a28dc1df4b49231cfcfbe584905bb87fdc0c8abb81e7ee2  /tmp/oorexx_webdav_v0.1-dev4.zip' | sha256sum -c -
          rm -rf /tmp/webdav-expand
          mkdir -p /tmp/webdav-expand
          unzip -q /tmp/oorexx_webdav_v0.1-dev4.zip -d /tmp/webdav-expand
          test -f /tmp/webdav-expand/webdav_dev4/VERSION.txt
          test "$(cat /tmp/webdav-expand/webdav_dev4/VERSION.txt)" = "0.1-dev4"
          rm -rf packages/oorexx_webdav_v0.1-dev4
          mkdir -p packages/oorexx_webdav_v0.1-dev4
          cp -a /tmp/webdav-expand/webdav_dev4/. packages/oorexx_webdav_v0.1-dev4/
          rm -rf .webdav-stage
          rm -f .github/workflows/webdav-publish.yml
      - name: Commit canonical source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Alchemy Publisher'
          git config user.email '131276687+animatedads@users.noreply.github.com'
          git add -A
          git commit -m 'Complete ooRexx WebDAV Gateway v0.1-dev4 source tree' -m 'Replace transient staging/archive material with the canonical qualified source/test tree after SHA-256 verification.'
          git push origin HEAD:main
