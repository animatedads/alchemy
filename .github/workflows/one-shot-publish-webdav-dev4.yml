name: one-shot publish ooRexx WebDAV dev4
on:
  push:
    branches: [main]
    paths:
      - '.alchemy-staging/**'
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand exact qualified package
        shell: bash
        run: |
          set -euo pipefail
          test -f .alchemy-staging/oorexx_webdav_v0.1-dev4.zip
          rm -rf /tmp/webdav-publish
          mkdir -p /tmp/webdav-publish
          unzip -q .alchemy-staging/oorexx_webdav_v0.1-dev4.zip -d /tmp/webdav-publish
          test -f /tmp/webdav-publish/webdav_dev4/VERSION.txt
          test "$(cat /tmp/webdav-publish/webdav_dev4/VERSION.txt)" = "0.1-dev4"
          rm -rf packages/oorexx_webdav_v0.1-dev4
          mkdir -p packages/oorexx_webdav_v0.1-dev4
          cp -a /tmp/webdav-publish/webdav_dev4/. packages/oorexx_webdav_v0.1-dev4/
          rm -rf .alchemy-staging
          rm -f .github/workflows/one-shot-publish-webdav-dev4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ooRexx WebDAV Gateway v0.1-dev4"
          git pull --rebase origin main
          git push origin HEAD:main
