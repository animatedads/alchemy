name: Install alchemy-publish command
on:
  push:
    branches:
      - publication/alchemy-publish-command
    paths:
      - publication_payload/COMMAND_READY
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication/alchemy-publish-command
          fetch-depth: 0
      - name: Verify, install, test and commit command
        shell: bash
        run: |
          set -euo pipefail
          cat publication_payload/pubcmd.part-* | base64 --decode > /tmp/pubcmd.tar.gz
          printf '%s  %s\n' '6f7845e32cdaa1098956532035d480f72499093a0d246e4458a4116c824084e7' /tmp/pubcmd.tar.gz | sha256sum -c -
          tar -xzf /tmp/pubcmd.tar.gz -C .
          chmod +x bin/alchemy-publish tools/alchemy_publish.py
          python3 -m py_compile tools/alchemy_publish.py tools/alchemy_publication/*.py
          python3 tests/test_alchemy_publish.py -v
          rm -rf publication_payload
          rm -f .github/workflows/install-alchemy-publish-command.yml
          git config user.name 'Alchemy Publication Bot'
          git config user.email '131276687+animatedads@users.noreply.github.com'
          git add -A
          git commit -m 'publication: add repeatable alchemy-publish command'
          git push origin HEAD:publication/alchemy-publish-command
